<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>无限画布工作台 - Video Farm Studio</title>
  <link href="/static/style.css?v=studio20261003-10" rel="stylesheet"/>
  <link href="/static/studio.css?v=studio20261003-10" rel="stylesheet"/>
  <style>
    .canvas-workspace-layout {
      position: relative;
      display: flex;
      flex: 1;
      width: 100%;
      height: calc(100vh - 53px);
      overflow: hidden;
      background: #121212;
    }
    .canvas-iframe-wrapper {
      flex: 1;
      height: 100%;
      display: flex;
      position: relative;
    }
    .canvas-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #141414;
    }
    .canvas-media-drawer {
      position: absolute;
      top: 0;
      right: 0;
      width: 320px;
      height: 100%;
      background: var(--surface-bg, #1e1e1e);
      border-left: 1px solid var(--border-color, #333);
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 20;
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.4);
    }
    .canvas-media-drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color, #333);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-header h3 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .drawer-media-card {
      background: var(--card-bg, #262626);
      border: 1px solid var(--border-color, #3a3a3a);
      border-radius: 6px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    .pill.status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted, #aaa);
    }
    .pill.status-pill.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .pill.status-pill.offline {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
  </style>
</head>
<body class="farm-console">
  <div class="studio-shell">
    <aside aria-label="主导航" class="studio-sidebar" id="studio-sidebar">
      <a class="studio-brand" href="/">
        <span class="studio-mark">VF</span>
        <span class="brand-caption">Video Farm</span>
      </a>
      <nav aria-label="工作空间" class="studio-navigation">
        <a class="tab-button" href="/#view-generate" title="视频创作">
          <span aria-hidden="true" class="ui-icon icon-clapperboard"></span>
          <span>视频创作</span>
        </a>
        <a class="tab-button" href="/#view-audio" style="display:none!important" title="配音音频">
          <span aria-hidden="true" class="ui-icon icon-audio-lines"></span>
          <span>配音音频</span>
        </a>
        <a class="tab-button" href="/#view-images" title="图像素材">
          <span aria-hidden="true" class="ui-icon icon-images"></span>
          <span>图像素材</span>
        </a>
        <a class="tab-button" href="/#view-tasks" title="任务成片">
          <span aria-hidden="true" class="ui-icon icon-list-video"></span>
          <span>任务成片</span>
        </a>
        <a class="tab-button" href="/#view-profiles" title="账号管理">
          <span aria-hidden="true" class="ui-icon icon-users-round"></span>
          <span>账号管理</span>
        </a>
        <a class="tab-button" href="/vids" title="连续分镜工程">
          <span aria-hidden="true" class="ui-icon icon-panels-top-left"></span>
          <span>连续分镜</span>
        </a>
        <a class="tab-button active" href="/canvas" id="nav-infinite-canvas" title="无限画布工作台">
          <span aria-hidden="true" class="ui-icon icon-layers"></span>
          <span>无限画布</span>
        </a>
      </nav>
      <div class="sidebar-foot"><span class="sidebar-dot"></span> 本机工作室</div>
    </aside>
    <div class="studio-main" style="padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden;">
      <header class="navbar" style="border-bottom:1px solid var(--border-color,#333);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;background:var(--surface-bg,#1a1a1a);flex-shrink:0;">
        <div class="workspace-location" style="display:flex;align-items:center;gap:12px;">
          <span>工作空间 / <b id="workspace-title">无限画布 (Infinite Canvas)</b></span>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="pill status-pill online" id="canvas-status-pill">● 画布 3000 在线</span>
            <span class="pill status-pill online" id="proxy-status-pill">● 代理 23210 就绪</span>
            <span class="pill status-pill online" id="cpa-status-pill">● 8317 直连</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <a class="btn btn-secondary btn-sm" id="btn-download-sample-suite" href="/api/canvas/sample-project-zip" download="canvas_verified_suite.zip" style="text-decoration:none;background:rgba(59,130,246,0.15);color:#60a5fa;border:1px solid rgba(59,130,246,0.3);" title="下载官方真实测试素材与全功能工程包（含生图、双平台视频、提示词）">📥 官方测试工程包 (.zip)</a>
          <button class="btn btn-secondary btn-sm" id="btn-refresh-canvas" title="重新加载画布">刷新画布</button>
          <button class="btn btn-secondary btn-sm" id="btn-toggle-media-drawer" title="查看视频工坊媒体并置入画布">视频工坊素材库</button>
          <a class="btn btn-primary btn-sm" id="btn-open-standalone" href="http://127.0.0.1:3000/canvas/proj_test_suite_001" target="_blank" rel="noopener noreferrer" style="text-decoration:none;" title="在新标签页全屏打开画布">独立窗口 ↗</a>
        </div>
      </header>
      <main class="canvas-workspace-layout">
        <div class="canvas-iframe-wrapper">
          <iframe class="canvas-iframe" id="canvas-iframe" src="http://127.0.0.1:3000/canvas/proj_test_suite_001" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
        </div>
        <aside class="canvas-media-drawer" id="canvas-media-drawer">
          <div class="drawer-header">
            <h3>视频工坊素材库</h3>
            <div style="display:flex;align-items:center;gap:6px;">
              <button class="btn btn-secondary btn-sm" id="btn-import-canvas-local" style="font-size:11px;padding:2px 8px;" title="将外部素材或画布成果导入视频工坊">+ 导入工坊</button>
              <input type="file" id="canvas-import-file-input" accept="image/*,video/*" style="display:none;" />
              <button class="btn btn-icon btn-sm" onclick="document.getElementById('canvas-media-drawer').classList.remove('open')" title="关闭抽屉">✕</button>
            </div>
          </div>
          <div id="canvas-import-alert" style="display:none;padding:6px 12px;background:rgba(16,185,129,0.15);color:#34d399;font-size:11px;border-bottom:1px solid #333;">
            素材已成功同步至工坊！
          </div>
          <div class="drawer-body" id="drawer-media-list">
            <div style="padding:12px;color:var(--text-muted);font-size:12px;">点击上方按钮加载最新成片...</div>
          </div>
        </aside>
      </main>
    </div>
  </div>
  <script src="/static/canvas-bridge.js?v=studio20261003-10"></script>
  <script src="/static/studio-shell.js?v=studio20261003-10"></script>
</body>
</html>
